# Staging stack (proposal §7: containerised, reproducible environments).
#   docker compose -f deploy/docker-compose.staging.yml --env-file deploy/staging.env up -d
# Images come from GitHub Container Registry (built by CI on every push to main);
# `--build` builds them locally instead.
name: model-portfolio-staging

x-api-env: &api-env
  DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/portfolio
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/staging.env}
  NODE_ENV: production
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.test}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in deploy/staging.env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: portfolio
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U portfolio -d portfolio]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20

  # One-off: apply migrations and seed the sample catalogue + first admin.
  migrate:
    image: ${REGISTRY:-ghcr.io/somaxsoma}/ai-model-portfolio-api:${TAG:-latest}
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    environment: *api-env
    command: [sh, -c, node apps/api/dist/migrate.js && node apps/api/dist/seed.js]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ${REGISTRY:-ghcr.io/somaxsoma}/ai-model-portfolio-api:${TAG:-latest}
    environment:
      <<: *api-env
      # Stateless API: scheduled jobs run in the worker.
      SCHEDULER: 'off'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    image: ${REGISTRY:-ghcr.io/somaxsoma}/ai-model-portfolio-api:${TAG:-latest}
    environment: *api-env
    command: [node, apps/api/dist/worker.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: unless-stopped

  web:
    image: ${REGISTRY:-ghcr.io/somaxsoma}/ai-model-portfolio-web:${TAG:-latest}
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    ports: ['${WEB_PORT:-8080}:8080']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
