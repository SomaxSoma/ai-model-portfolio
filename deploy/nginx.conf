# Reuse connections to the API. Without keepalive, every proxied request opens
# a new TCP connection; under load the TIME_WAIT sockets exhaust ephemeral
# ports and nginx answers 502.
upstream api {
  server api:3001;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

  # The REST API, same origin. The /api prefix is stripped.
  location /api/ {
    proxy_pass http://api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # A location with its own add_header drops the server-level ones, so repeat the important one.
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Single-page app: every other path serves index.html.
  location / {
    try_files $uri /index.html;
  }
}
